<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#072A35"/>
      <stop offset="50%" stop-color="#0F4C5C"/>
      <stop offset="100%" stop-color="#1B7A9E"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="42%" r="48%">
      <stop offset="0%" stop-color="#5FD9FF" stop-opacity="0.42"/>
      <stop offset="100%" stop-color="#0F4C5C" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="dropShell" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0%" stop-color="#9BEBFF"/>
      <stop offset="45%" stop-color="#3BB4EC"/>
      <stop offset="100%" stop-color="#136396"/>
    </linearGradient>
    <linearGradient id="waveFront" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6FE3FF"/>
      <stop offset="55%" stop-color="#2296D4"/>
      <stop offset="100%" stop-color="#0D4F7C"/>
    </linearGradient>
    <clipPath id="dropClip">
      <path d="M256 64C348 184 404 252 404 326A148 148 0 0 1 108 326C108 252 164 184 256 64Z"/>
    </clipPath>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="135%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#041B24" flood-opacity="0.55"/>
    </filter>
  </defs>

  <!-- App Icon Squircle Background -->
  <rect width="512" height="512" rx="116" fill="url(#bg)"/>
  <circle cx="256" cy="240" r="220" fill="url(#glow)"/>

  <!-- Subtle Outer Energy Rings -->
  <circle cx="256" cy="286" r="182" fill="none" stroke="#62D9FF" stroke-width="2.5" stroke-opacity="0.22"/>
  <circle cx="256" cy="286" r="160" fill="none" stroke="#9BEBFF" stroke-width="2" stroke-opacity="0.16" stroke-dasharray="10 12"/>

  <!-- Main 3D Water Droplet -->
  <g filter="url(#shadow)">
    <path d="M256 64C348 184 404 252 404 326A148 148 0 0 1 108 326C108 252 164 184 256 64Z" fill="url(#dropShell)"/>
  </g>

  <!-- Multi-layer Liquid Waves & Bubbles Inside Droplet -->
  <g clip-path="url(#dropClip)">
    <path d="M80 282C140 256 200 306 260 280C320 254 380 302 440 276V490H80Z" fill="#B5F2FF" opacity="0.45"/>
    <path d="M80 306C145 334 210 282 275 310C340 338 395 290 445 312V490H80Z" fill="url(#waveFront)" opacity="0.92"/>
    <path d="M80 306C145 334 210 282 275 310C340 338 395 290 445 312" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" opacity="0.75"/>

    <!-- Rising Oxygen Bubbles -->
    <circle cx="212" cy="392" r="14" fill="#FFFFFF" opacity="0.65"/>
    <circle cx="288" cy="366" r="9.5" fill="#FFFFFF" opacity="0.55"/>
    <circle cx="248" cy="426" r="7" fill="#FFFFFF" opacity="0.5"/>
    <circle cx="316" cy="410" r="12" fill="#FFFFFF" opacity="0.45"/>
  </g>

  <!-- Glossy Glass Rim & Specular Highlights -->
  <path d="M256 64C348 184 404 252 404 326A148 148 0 0 1 108 326C108 252 164 184 256 64Z" fill="none" stroke="#D8F7FF" stroke-width="5" stroke-opacity="0.65"/>
  <path d="M168 246C146 286 146 338 174 378" fill="none" stroke="#FFFFFF" stroke-width="16" stroke-linecap="round" opacity="0.78"/>
  <circle cx="192" cy="212" r="8" fill="#FFFFFF" opacity="0.82"/>
</svg>
